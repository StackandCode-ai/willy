# truewilly.com: this site at the root, the owner's own Willy hub under /willy/.
# Merge into the existing server block for truewilly.com (keep the existing /willy/ proxy and
# certificate lines as they are). Files go to /var/www/truewilly (copy website/index.html there).
#
#   root /var/www/truewilly;
#   index index.html;
#
#   location = / { try_files /index.html =404; }
#   location / { try_files $uri $uri/ =404; }
#
#   # existing hub proxy stays:
#   # location /willy/ { proxy_pass http://127.0.0.1:8000/; ... websocket upgrade headers ... }
#
# Note: a 403 at the root today comes from a missing index file; adding index.html fixes it.
