name: willy_mobile
description: "Willy Autonomous Voice Assistant & Remote Windows Controller Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  audioplayers: ^6.0.0
  record: ^5.1.2
  intl: ^0.19.0
  path_provider: ^2.1.2
  camera: ^0.12.0+1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_platform_interface: 1.1.0
