# Publish a version:   git tag v1.0.0 && git push origin v1.0.0
# Builds WillyPC (Windows), the Android app and the server package, and attaches them to a
# GitHub Release. truewilly.com reads the latest release for its download buttons.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the server
        run: |
          mkdir -p out
          git archive --format=tar.gz --prefix=willy/ -o out/willy-server.tar.gz HEAD \
            -- install docker-compose.yml Dockerfile .dockerignore server server_agent pc_client/tools/git_ops.py pc_client/__init__.py README.md LICENSE
      - uses: actions/upload-artifact@v4
        with: { name: server, path: out/willy-server.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pc_client/requirements.txt
      - name: Build WillyPC.exe
        run: python build_pc_exe.py --ci
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/WillyPC-windows.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.7", channel: stable, cache: true }
      - name: Signing key and push settings (optional secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/willy.jks"
            echo "WILLY_KEYSTORE_FILE=$RUNNER_TEMP/willy.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a throwaway debug key."
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > mobile_app/android/app/google-services.json
          fi
      - name: Build the APK
        working-directory: mobile_app
        env:
          WILLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WILLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WILLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          VERSION="${GITHUB_REF_NAME#v}"; case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0";; esac
          flutter build apk --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk ../Willy.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Willy.apk }

  publish:
    needs: [server, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
